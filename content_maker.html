<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘텐츠 메이커</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242b;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:18px;margin:12px 0}.row{display:flex;gap:8px}.grow{flex:1}input,select,textarea{width:100%;border:1px solid #d7dce3;border-radius:10px;padding:11px;font-size:14px}textarea{line-height:1.65;resize:vertical}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#20242b;color:#fff}.secondary{background:#edf0f4}.muted{font-size:12px;color:#707783}.status{font-size:13px;margin-top:9px;white-space:pre-wrap}.ok{color:#147a3d}.err{color:#b00020}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:#eef2ff;padding:7px 10px;border-radius:99px}.tag button{padding:0 0 0 6px;background:none;color:#777}.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.opt{border:1px solid #dfe3e8;border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:13px}.opt.active{background:#20242b;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.source{border:1px solid #e1e5ea;border-radius:10px;padding:10px;margin:8px 0}.shot{border:1px solid #e1e5ea;border-radius:13px;padding:13px;margin-top:10px}.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.img img{width:100%;aspect-ratio:16/10;object-fit:cover}.img{border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer}.img.sel{border-color:#20242b}.cap{font-size:11px;padding:7px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2ff;font-size:11px;margin:3px}@media(max-width:780px){.grid2{grid-template-columns:1fr}.opts{grid-template-columns:repeat(2,1fr)}.imgs{grid-template-columns:repeat(2,1fr)}} 
</style></head><body><div class="wrap">
<h1>⚡ 콘텐츠 메이커</h1><p class="muted">실제 Chrome에서 나무위키 검색 → '논란/이슈' 링크 선택 → 해당 페이지 전체 텍스트 수집 → AI 편집</p>
<div class="card"><div class="row"><b class="grow">🔌 상태</b><button class="secondary" onclick="health()">확인</button></div><div id="health" class="status">확인 중...</div></div>
<div class="card"><b>① 검색어</b><div class="row" style="margin-top:9px"><input id="kw" placeholder="예: 하영, 안상호"><button class="primary" onclick="add()">추가</button></div><div id="tags" class="tags"></div><div class="muted">쉼표/엔터 · 최대 5개</div></div>
<div class="card"><b>② 주제 / 검색 링크 기준</b><div class="opts"><div class="opt active" data-v="논란">논란</div><div class="opt" data-v="열애설">열애설</div><div class="opt" data-v="사건">사건</div><div class="opt" data-v="이슈">이슈</div><div class="opt" data-v="친일">친일</div><div class="opt" data-v="학폭">학폭</div><div class="opt" data-v="근황">근황</div><div class="opt" data-v="인물">인물</div></div><input id="custom" style="margin-top:9px" placeholder="직접 검색 링크 기준 입력"></div>
<div class="card"><b>③ AI 작성</b><div class="grid2" style="margin-top:9px"><select id="style"><option>네이버 블로그형</option><option>뉴스·기사형</option><option>흥미로운 스토리형</option><option>팩트체크형</option><option>연예 이슈형</option></select><select id="length"><option>짧게</option><option selected>보통</option><option>길게</option></select></div></div>
<div class="card"><textarea id="extra" rows="3" placeholder="추가 자료가 있으면 입력"></textarea></div>
<div class="card"><button class="primary" style="width:100%;font-size:16px" onclick="generate()">🔎 나무위키 검색해서 콘텐츠 만들기</button><div id="status" class="status">Chrome 창이 열리고 나무위키 검색을 진행합니다.</div></div>
<div class="grid2"><div class="card"><div class="row"><b class="grow">📝 블로그</b><button class="secondary" onclick="copy('blog')">복사</button></div><textarea id="blog" rows="32"></textarea></div><div class="card"><div class="row"><b class="grow">📱 쇼츠</b><button class="secondary" onclick="copy('shorts')">복사</button></div><textarea id="shorts" rows="32"></textarea><div id="hash"></div></div></div>
<div class="card"><b>📚 실제 크롤링한 페이지</b><div id="sources"></div></div>
<div class="card"><b>🖼 쇼츠 이미지</b><div id="scenes"></div></div>
</div>
<script>
let kws=[],topic="논란",scenes=[];const $=id=>document.getElementById(id);
$("kw").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
document.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{document.querySelectorAll(".opt").forEach(y=>y.classList.remove("active"));x.classList.add("active");topic=x.dataset.v});
function add(){$("kw").value.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!kws.includes(x)&&kws.length<5)kws.push(x)});$("kw").value="";$("tags").innerHTML=kws.map((x,i)=>`<span class="tag">${esc(x)} <button onclick="kws.splice(${i},1);addRender()">×</button></span>`).join("")}
function addRender(){$("tags").innerHTML=kws.map((x,i)=>`<span class="tag">${esc(x)} <button onclick="kws.splice(${i},1);addRender()">×</button></span>`).join("")}
async function health(){try{const r=await fetch("/api/health");const d=await r.json();$("health").className="status "+(d.apiKeyConfigured?"ok":"err");$("health").textContent=(d.apiKeyConfigured?"✅":"❌")+" 서버 연결 / API 키 "+(d.apiKeyConfigured?"인식":"없음")+" / "+d.browser}catch(e){$("health").textContent="❌ "+e.message}}
async function generate(){
 if(!kws.length)return alert("검색어를 입력해주세요.");
 const focus=$("custom").value.trim()||topic;
 try{
  $("status").textContent="🌐 Chrome에서 나무위키 접속 중...";
  const nr=await fetch("/api/namu-crawl",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({keywords:kws,focus})});
  const nd=await nr.json();
  if(!nr.ok||!nd.ok)throw Error("나무위키 크롤링 실패\\n"+(nd.error||"HTTP "+nr.status));
  $("sources").innerHTML=nd.docs.map(d=>`<div class="source"><b>${esc(d.keyword)}</b> → ${esc(d.searchResult)}<br><a href="${esc(d.url)}" target="_blank">${esc(d.url)}</a><br><span class="muted">${esc(d.text.slice(0,1000))}...</span></div>`).join("");
  $("status").textContent="🤖 나무위키 페이지를 AI가 블로그/쇼츠로 편집 중...";
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({keywords:kws,topic:focus,style:$("style").value,length:$("length").value,sourceText:$("extra").value,docs:nd.docs})});
  const d=await r.json();if(!r.ok||!d.ok)throw Error("AI 생성 실패 HTTP "+r.status+"\\n"+(d.error||""));
  $("blog").value=(d.title?d.title+"\\n\\n":"")+(d.blog||"");$("shorts").value=(d.shorts||[]).map(x=>`[${x.time}]\\n${x.text}`).join("\\n\\n");$("hash").innerHTML=(d.hashtags||[]).map(x=>`<span class="badge">${esc(x)}</span>`).join("");
  $("status").className="status ok";$("status").textContent="✅ 나무위키 검색·페이지 크롤링·AI 편집 완료";
 }catch(e){$("status").className="status err";$("status").textContent="❌ "+e.message;alert("콘텐츠 생성 오류\\n\\n"+e.message)}
}
function copy(id){navigator.clipboard.writeText($(id).value).then(()=>alert("복사했습니다."))}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
health();
</script></body></html>
