<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘텐츠 메이커</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242b;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:18px;margin:12px 0}.row{display:flex;gap:8px}.grow{flex:1}input,select,textarea{width:100%;border:1px solid #d7dce3;border-radius:10px;padding:11px;font-size:14px}textarea{line-height:1.65}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#20242b;color:#fff}.secondary{background:#edf0f4}.status{font-size:13px;margin-top:9px;white-space:pre-wrap}.ok{color:#147a3d}.err{color:#b00020}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:#eef2ff;padding:7px 10px;border-radius:99px}.tag button{padding:0 0 0 6px;background:none}.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.opt{border:1px solid #dfe3e8;border-radius:10px;padding:10px;text-align:center;cursor:pointer}.opt.active{background:#20242b;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact,.source{padding:10px;margin:8px 0;border:1px solid #e1e5ea;border-radius:10px}.shot{border:1px solid #e1e5ea;border-radius:13px;padding:13px;margin-top:10px}.muted{font-size:12px;color:#707783}@media(max-width:780px){.grid2{grid-template-columns:1fr}.opts{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="wrap"><h1>⚡ 콘텐츠 메이커</h1><p class="muted">Chrome에서 나무위키 검색 → 주제 링크 클릭 → 문서 수집 → AI 작성</p>
<div class="card"><b>① 검색어</b><div class="row" style="margin-top:9px"><input id="kw" placeholder="예: 하영, 안상호"><button class="primary" onclick="add()">추가</button></div><div id="tags" class="tags"></div></div>
<div class="card"><b>② 주제</b><div class="opts"><div class="opt active" data-v="인물 소개">인물 소개</div><div class="opt" data-v="열애설">열애설</div><div class="opt" data-v="논란">논란</div><div class="opt" data-v="사건·이슈">사건·이슈</div><div class="opt" data-v="친일 논란">친일 논란</div><div class="opt" data-v="친중 논란">친중 논란</div><div class="opt" data-v="학폭 논란">학폭 논란</div><div class="opt" data-v="근황">근황</div><div class="opt" data-v="과거 발언">과거 발언</div><div class="opt" data-v="관계 분석">관계 분석</div><div class="opt" data-v="자유 주제">자유 주제</div></div><input id="custom" style="margin-top:9px" placeholder="직접 주제"></div>
<div class="card"><b>③ 스타일</b><div class="grid2" style="margin-top:9px"><select id="style"><option>네이버 블로그형</option><option>뉴스·기사형</option><option>흥미로운 스토리형</option><option>팩트체크형</option><option>연예 이슈형</option></select><select id="length"><option>짧게</option><option selected>보통</option><option>길게</option></select></div></div>
<div class="card"><textarea id="extra" rows="3" placeholder="추가 자료(선택)"></textarea></div>
<div class="card"><button class="primary" style="width:100%;font-size:16px" onclick="generate()">🔎 나무위키 검색 → AI 콘텐츠 생성</button><div id="status" class="status">Chrome 자동화가 실행됩니다.</div></div>
<div class="grid2"><div class="card"><b>📝 블로그</b><button class="secondary" onclick="copy('blog')">복사</button><textarea id="blog" rows="30"></textarea></div><div class="card"><b>📱 쇼츠 자막</b><button class="secondary" onclick="copy('shorts')">복사</button><textarea id="shorts" rows="30"></textarea><div id="hashtags"></div></div></div>
<div class="card"><b>📌 사실관계</b><div id="facts"></div></div><div class="card"><b>🔗 수집한 문서</b><div id="sources"></div></div>
</div>
<script>
let kws=[],topic="인물 소개";const $=id=>document.getElementById(id);
$("kw").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};document.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{document.querySelectorAll(".opt").forEach(y=>y.classList.remove("active"));x.classList.add("active");topic=x.dataset.v});
function add(){$("kw").value.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!kws.includes(x)&&kws.length<5)kws.push(x)});$("kw").value="";$("tags").innerHTML=kws.map((x,i)=>`<span class="tag">${esc(x)} <button onclick="kws.splice(${i},1);addRender()">×</button></span>`).join("")}function addRender(){$("tags").innerHTML=kws.map((x,i)=>`<span class="tag">${esc(x)} <button onclick="kws.splice(${i},1);addRender()">×</button></span>`).join("")}
async function generate(){if(!kws.length)return alert("검색어를 입력하세요.");const t=$("custom").value.trim()||topic;$("status").textContent="🌐 Chrome에서 나무위키 검색 중...";try{const nr=await fetch("/api/namu-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({keywords:kws,topic:t})});const nd=await nr.json();if(!nr.ok||!nd.ok)throw Error(nd.error||"나무위키 검색 실패");$("sources").innerHTML=(nd.docs||[]).map(d=>`<div class="source"><b>${esc(d.keyword)} → ${esc(d.title)}</b><br><a href="${esc(d.url)}" target="_blank">${esc(d.url)}</a><br><span class="muted">선택 링크: ${esc(d.selected?.text||"")}</span></div>`).join("");$("status").textContent="🤖 문서 수집 완료. AI가 블로그/쇼츠를 작성 중...";const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({keywords:kws,topic:t,style:$("style").value,length:$("length").value,sourceText:$("extra").value,docs:nd.docs})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"AI 생성 실패");$("blog").value=(d.title?d.title+"\n\n":"")+(d.blog||"");$("shorts").value=(d.shorts||[]).map(x=>`[${x.time}]\n${x.text}`).join("\n\n");$("hashtags").innerHTML=(d.hashtags||[]).map(x=>`<span>${esc(x)} </span>`).join("");$("facts").innerHTML=(d.factCheck||[]).map(x=>`<div class="fact"><b>${esc(x.status)}</b> ${esc(x.claim)}<br><span class="muted">${esc(x.explanation)}</span></div>`).join("");$("status").className="status ok";$("status").textContent="✅ 완료"}catch(e){$("status").className="status err";$("status").textContent="❌ 생성 실패\n"+e.message;alert("콘텐츠 생성 오류\n\n"+e.message)}}
function copy(id){navigator.clipboard.writeText($(id).value).then(()=>alert("복사했습니다."))}function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
</script></body></html>
