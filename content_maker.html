<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>콘텐츠 메이커</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#20242b;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:1250px;margin:auto;padding:24px 16px 60px}
.card{background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:18px;margin:12px 0}
.row{display:flex;gap:8px}.grow{flex:1}
input,select,textarea{width:100%;border:1px solid #d7dce3;border-radius:10px;padding:11px;font-size:14px}
textarea{line-height:1.7;resize:vertical}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:#20242b;color:#fff}.secondary{background:#edf0f4}
.status{font-size:13px;margin-top:9px;white-space:pre-wrap}
.ok{color:#147a3d}.err{color:#b00020}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tag{background:#eef2ff;padding:7px 10px;border-radius:99px}
.tag button{padding:0 0 0 6px;background:none}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.opt{border:1px solid #dfe3e8;border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.opt.active{background:#20242b;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact,.source{padding:10px;margin:8px 0;border:1px solid #e1e5ea;border-radius:10px}
.muted{font-size:12px;color:#707783}
.preview{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:22px;line-height:1.85}
.preview h1{font-size:30px;line-height:1.35;margin:0 0 22px;font-weight:800}.preview h2{font-size:26px;line-height:1.45;margin:32px 0 12px;font-weight:800;border-left:5px solid #20242b;padding-left:12px}.preview h3{font-size:21px;line-height:1.5;margin:24px 0 10px;font-weight:800}.preview .summary{background:#f5f7fb;border-radius:10px;padding:14px 16px;margin-bottom:24px;font-weight:600;line-height:1.7}
.preview p{white-space:pre-wrap;margin:0 0 15px}
.preview img{display:block;max-width:100%;max-height:520px;object-fit:contain;margin:14px auto;border-radius:10px}
.shot{border:1px solid #e1e5ea;border-radius:13px;padding:13px;margin-top:10px}
.imggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.imgcard{border:1px solid #ddd;border-radius:10px;overflow:hidden}
.imgcard img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.imgcard div{font-size:11px;padding:7px}
@media(max-width:780px){
 .grid2{grid-template-columns:1fr}
 .opts{grid-template-columns:repeat(2,1fr)}
 .imggrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">

<h1>⚡ 콘텐츠 메이커</h1>
<p class="muted">
나무위키 브라우저 검색 → 관련 문서 클릭 → 본문/소제목/이미지 수집 → AI 콘텐츠 작성
</p>

<div class="card">
<b>① 검색어</b>
<div class="row" style="margin-top:9px">
<input id="kw" placeholder="예: 하영, 안상호">
<button class="primary" onclick="add()">추가</button>
</div>
<div id="tags" class="tags"></div>
</div>

<div class="card">
<b>② 주제</b>
<div class="opts">
<div class="opt active" data-v="인물 소개">인물 소개</div>
<div class="opt" data-v="열애설">열애설</div>
<div class="opt" data-v="논란">논란</div>
<div class="opt" data-v="사건·이슈">사건·이슈</div>
<div class="opt" data-v="친일 논란">친일 논란</div>
<div class="opt" data-v="친중 논란">친중 논란</div>
<div class="opt" data-v="학폭 논란">학폭 논란</div>
<div class="opt" data-v="근황">근황</div>
<div class="opt" data-v="과거 발언">과거 발언</div>
<div class="opt" data-v="관계 분석">관계 분석</div>
<div class="opt" data-v="자유 주제">자유 주제</div>
</div>
<input id="custom" style="margin-top:9px" placeholder="직접 주제">
</div>

<div class="card">
<b>③ 스타일</b>
<div class="grid2" style="margin-top:9px">
<select id="style">
<option>네이버 블로그형</option>
<option>뉴스·기사형</option>
<option>흥미로운 스토리형</option>
<option>팩트체크형</option>
<option>연예 이슈형</option>
<option>자극적 이슈형</option>
</select>
<select id="length">
<option>짧게</option>
<option selected>보통</option>
<option>길게</option>
</select>
</div>
</div>

<div class="card">
<textarea id="extra" rows="3" placeholder="추가 자료가 있다면 입력하세요."></textarea>
</div>

<div class="card">
<button class="primary" style="width:100%;font-size:16px" onclick="generate()">
🔎 나무위키 검색 → 블로그 + 쇼츠 생성
</button>
<div id="status" class="status">준비 완료</div>
</div>

<div class="grid2">

<div class="card">
<div class="row">
<b class="grow">📝 블로그 원문</b>
<button class="secondary" onclick="copy('blog')">복사</button>
</div>
<textarea id="blog" rows="30"></textarea>
</div>

<div class="card">
<div class="row">
<b class="grow">📱 쇼츠 자막</b>
<button class="secondary" onclick="copy('shorts')">복사</button>
</div>
<textarea id="shorts" rows="30"></textarea>
<div id="hashtags"></div>
</div>

</div>

<div class="card">
<b>🖼 블로그 미리보기</b>
<p class="muted">
나무위키 문서에서 수집한 이미지가 내용과 맞는 위치에 배치됩니다.
</p>
<div id="blogPreview" class="preview"></div>
</div>

<div class="card">
<b>📌 사실관계</b>
<div id="facts"></div>
</div>

<div class="card">
<b>🔗 수집한 문서 / 소제목 / 이미지</b>
<div id="sources"></div>
</div>

</div>

<script>
let kws=[];
let topic="인물 소개";
let resultData=null;

const $=id=>document.getElementById(id);

$("kw").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    add();
  }
});

document.querySelectorAll(".opt").forEach(x=>{
  x.onclick=()=>{
    document.querySelectorAll(".opt")
      .forEach(y=>y.classList.remove("active"));

    x.classList.add("active");
    topic=x.dataset.v;
  };
});

function add(){
  $("kw").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean)
    .forEach(x=>{
      if(!kws.includes(x)&&kws.length<5){
        kws.push(x);
      }
    });

  $("kw").value="";
  renderTags();
}

function renderTags(){
  $("tags").innerHTML=kws.map((x,i)=>
    `<span class="tag">
      ${esc(x)}
      <button onclick="kws.splice(${i},1);renderTags()">×</button>
    </span>`
  ).join("");
}

function selectedTopic(){
  return $("custom").value.trim()||topic;
}

async function generate(){

  if(!kws.length){
    alert("검색어를 입력하세요.");
    return;
  }

  const t=selectedTopic();

  $("status").className="status";
  $("status").textContent=
    "🌐 나무위키에서 관련 문서를 찾는 중...";

  try{

    const nr=await fetch("/api/namu-crawl",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        keywords:kws,
        topic:t
      })
    });

    const nd=await nr.json();

    if(!nr.ok||!nd.ok){
      throw Error(
        nd.error||"나무위키 검색 실패"
      );
    }

    renderSources(nd.docs||[]);

    $("status").textContent=
      "🤖 자료 수집 완료. 사건 흐름과 소제목을 구성하는 중...";

    const r=await fetch("/api/generate",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        keywords:kws,
        topic:t,
        style:$("style").value,
        length:$("length").value,
        sourceText:$("extra").value,
        docs:nd.docs
      })
    });

    const d=await r.json();

    if(!r.ok||!d.ok){
      throw Error(
        d.error||"AI 생성 실패"
      );
    }

    resultData=d;

    const sections=d.blogSections||[];

    $("blog").value=
      (d.title?d.title+"\n\n":"")+
      sections.map(s=>
        `${s.heading}\n\n${s.body}\n`
      ).join("\n");

    $("shorts").value=
      (d.shorts||[])
      .map(x=>
        `[${x.time}]\n${x.text}`
      )
      .join("\n\n");

    $("hashtags").innerHTML=
      (d.hashtags||[])
      .map(x=>`<span class="tag">${esc(x)}</span>`)
      .join("");

    $("facts").innerHTML=
      (d.factCheck||[])
      .map(x=>
        `<div class="fact">
          <b>${esc(x.status)}</b>
          ${esc(x.claim)}
          <br>
          <span class="muted">
            ${esc(x.explanation)}
          </span>
        </div>`
      ).join("");

    renderBlogPreview(d);
    renderSources(d.namuSources||[]);

    $("status").className="status ok";
    $("status").textContent=
      "✅ 블로그 + 쇼츠 생성 완료";

  }catch(e){

    console.error(e);

    $("status").className="status err";
    $("status").textContent=
      "❌ 생성 실패\n"+e.message;

    alert(
      "콘텐츠 생성 오류\n\n"+
      e.message
    );
  }
}

function renderBlogPreview(d){

  const sections=d.blogSections||[];
  let html="";

  if(d.title){
    html+=`<h1>${esc(d.title)}</h1>`;
  }

  if(d.summary){
    html+=`<div class="summary">${esc(d.summary)}</div>`;
  }

  for(const s of sections){
    const depth=Number(s.depth)||1;
    const tag=depth>=2 ? "h3" : "h2";

    html+=`<${tag}>${esc(s.heading||"")}</${tag}>`;

    if(s.imageUrl){
      html+=`<img src="${esc(s.imageUrl)}" alt="${esc(s.heading||"")}" loading="lazy" onerror="this.style.display='none'">`;
    }

    html+=`<p>${esc(s.body||"")}</p>`;
  }

  $("blogPreview").innerHTML=html;
}

function renderSources(docs){

  $("sources").innerHTML=
    docs.map(d=>{
      const toc=(d.toc||[]).map(x=>
        `<span class="tag">${esc((x.number?x.number+" ":"")+x.title)}</span>`
      ).join("");

      const images=(d.images||[]).map(im=>`
        <div class="imgcard">
          <img src="${esc(im.localUrl||im.src||"")}" alt="${esc(im.alt||im.title||"이미지")}" loading="lazy" onerror="this.parentElement.style.display='none'">
          <div>${esc(im.alt||im.title||"이미지")}</div>
        </div>
      `).join("");

      return `
        <div class="source">
          <b>${esc(d.keyword||"")} → ${esc(d.title||"")}</b>
          <br>
          <a href="${esc(d.url||"")}" target="_blank" rel="noopener">${esc(d.url||"")}</a>
          <p class="muted">원문 목차</p>
          <div>${toc||"<span class='muted'>목차 없음</span>"}</div>
          ${images ? `<p class="muted">수집 이미지 ${d.images.length}개</p><div class="imggrid">${images}</div>` : ""}
        </div>
      `;
    }).join("");
}

function copy(id){

  navigator.clipboard
    .writeText($(id).value)
    .then(()=>{
      alert("복사했습니다.");
    });

}

function esc(x){

  return String(x??"")
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
      }[m])
    );

}
</script>
</body>
</html>
