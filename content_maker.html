<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콘텐츠 메이커</title>
<style>
body{background:#f5f7fb;padding:20px;font-family:sans-serif}
.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px}
textarea, .result-area{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px}
</style>
</head>
<body>
<h1>⚡ 콘텐츠 메이커</h1>
<div class="card">
  <textarea id="pasteBox" rows="5" placeholder="내용을 붙여넣으세요..."></textarea>
  <button onclick="generate()">생성하기</button>
</div>
<div class="card">
  <div id="blog" class="result-area" style="white-space:pre-wrap;"></div>
</div>

<script>
async function generate(){
  const text = document.getElementById("pasteBox").value;
  const res = await fetch("/api/generate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      topic: "직접 붙여넣은 자료",
      style: "자극적이고 흥미로운 스토리형",
      length: "보통",
      sourceText: text,
      docs: []
    })
  });
  const data = await res.json();
  document.getElementById("blog").innerHTML = `<h1><b>${data.title}</b></h1>` + data.blog;
}
</script>
</body>
</html>
